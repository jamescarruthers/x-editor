name: CI

on:
  # A branch with an open PR would otherwise run twice per push, once for each trigger.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — pnpm/action-setup errors if the version is given both in the
      # action config and in package.json's `packageManager` field. package.json wins.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The XSD 1.1 differential oracle. libxml2 is 1.0-only and will not compile a schema using
      # xs:assert, so without this our engine would be the only 1.1 implementation in the stack and
      # nothing would check it. Pure Python, so there is nothing to build.
      # Two differential oracles, both pure-Python installs. Without them our engine would be the
      # only implementation of XSD 1.1 and of Schematron in the stack, with nothing checking it —
      # PLAN.md §11 risk 2 exactly.
      - name: Install the differential oracles
        run: python3 -m pip install --quiet --break-system-packages xmlschema==4.3.2 lxml

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -C apps/editor build

      # PLAN.md §11 risk 4: a stray top-level import pulling a validator into the main chunk is a
      # one-line mistake that costs every user the download and looks like nothing. It has happened
      # once already, so it is checked rather than remembered.
      - name: Check the bundle budget
        run: node scripts/check-bundle.mjs
